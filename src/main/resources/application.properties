# ============================================================
# Formation IT Platform - Configuration de l'application
# ============================================================

# --- Serveur ---
server.port=8080
spring.application.name=formation_it

# --- Base de donn�es MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/formation_it?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=wilfried2004@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
# Clé secrète (à remplacer par une variable d'environnement en production)
jwt.secret=SecretKey2024VeryLongSecretKeyForJWTTokenGeneration
jwt.expiration=86400000

# --- Upload fichiers ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
