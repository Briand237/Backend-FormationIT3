# ============================================================
# Formation IT Platform - Configuration de l'application
# ============================================================

# --- Serveur ---
server.port=${PORT:8080}
spring.application.name=formation_it

# --- Base de donnees MySQL Clever Cloud ---
spring.datasource.url=jdbc:mysql://${MYSQL_ADDON_HOST}:${MYSQL_ADDON_PORT}/${MYSQL_ADDON_DB}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_ADDON_USER}
spring.datasource.password=${MYSQL_ADDON_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
jwt.secret=${JWT_SECRET:SecretKey2024VeryLongSecretKeyForJWTTokenGeneration}
jwt.expiration=86400000

# --- Upload fichiers ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Pour que Render n'arrete pas au demarrage si MySQL est lent
spring.datasource.hikari.initialization-fail-timeout=60000